# HYDRA-UMC-SUITE - Manual desktop program build (build here, sign locally)
# Copyright (C) 2026 JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>
# GPL-3.0-or-later - see LICENSE
# =============================================================================
# Started by hand only (workflow_dispatch): it never runs on a push or a pull request. It builds the stand-alone program with PyInstaller (the same options as
# build_exe.bat / build_exe.sh) on three runners (Windows x86-64, Linux x86-64 and Linux arm64), packs each one with the language files and the documents that must sit
# next to it, and uploads the three archives with SHA256SUMS and a build manifest as one artifact with a build-provenance attestation. Every program is built TWICE
# on its runner and the bytes of the two programs are compared; the result is written in the manifest (PyInstaller does not promise identical bytes, so a difference
# is recorded, it does not stop the build).
#
# It holds no key and signs nothing: the archives are UNSIGNED. They are signed on the maintainer's machine, from this artifact, with the release key that never leaves it.
# With dry_run on (the default) nothing but the artifact is made; with it off a DRAFT release v<version>-exe with the unsigned archives is also prepared (it is never
# published from here).
# A failed or stuck build writes the Job Summary and opens (or updates) the issue "build-failed"; a later good build closes it.

name: Executable build (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check only, no draft release"
        type: boolean
        required: true
        default: true
      ref:
        description: "Branch, tag or commit of this repository"
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: exe-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      epoch: ${{ steps.plan.outputs.epoch }}
    steps:
      - name: Only the owner starts a build
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository starts a build"; exit 1; }

      - name: Check the inputs
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::the ref has characters that a branch, tag or commit does not have"; exit 1; }

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Make sure the commit belongs to the main branch
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # only code that is already in main is built: a branch or a fork commit that is not in main is refused
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "::error::the commit $(git rev-parse --short HEAD) is not part of the main branch; merge it first"; exit 1; }
          # the commit built is the one this run was started from (github.sha); the ref input can only confirm it, never choose another commit
          want="$(git rev-parse --verify --quiet "refs/remotes/origin/${REF}^{commit}" || git rev-parse --verify --quiet "refs/tags/${REF}^{commit}" || git rev-parse --verify --quiet "${REF}^{commit}" || true)"
          [ -n "$want" ] && [ "$want" = "$(git rev-parse HEAD)" ] || { echo "::error::the ref $REF is not the commit this run was started from ($(git rev-parse --short HEAD)); start the run from that ref"; exit 1; }

      - name: Work out the version and pin the commit
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('hydra-umc.project.json', encoding='utf-8'))['version'])")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::the version $version is not one the updater accepts"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version (raise the version BEFORE the build)"; exit 1; }
          native="$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([0-9.]+)\"', open('hydra_suite/__init__.py', encoding='utf-8').read()).group(1))")"
          [ "$native" = "$version" ] || { echo "::error::hydra_suite/__init__.py says $native, the manifest says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build on ${{ matrix.id }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-amd64
            runner: windows-latest
          - id: linux-amd64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.epoch }}
      PYTHONHASHSEED: "0"
      HYDRA_UMC_MESH_SOURCE: download
      ID: ${{ matrix.id }}
    steps:
      - name: Check out the exact commit that was planned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the system libraries Qt links against
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Fetch and verify the 3D models (pinned SHA-256 package)
        shell: bash
        run: |
          set -euo pipefail
          # the models are not in the repository tree; every one is checked by its SHA-256 before PyInstaller packs assets/
          python -m hydra_suite.mesh_pack ensure --source download

      - name: Install the dependencies and PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt pyinstaller==6.22.3

      - name: Write the build script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build_exe.py" <<'PY'
          """Builds the program twice with PyInstaller (the options of build_exe.bat / build_exe.sh), checks it is a program for this platform, packs it and writes its report."""
          import gzip, hashlib, json, os, platform, shutil, signal, struct, subprocess, sys, tarfile, time, zipfile
          from importlib.metadata import version as dist_version
          from pathlib import Path

          ident, version, out, work = sys.argv[1], sys.argv[2], Path(sys.argv[3]).resolve(), Path(sys.argv[4]).resolve()
          repo = Path.cwd().resolve()
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          windows = ident.startswith("windows")
          wanted_arch = {"windows-amd64": "x86-64", "linux-amd64": "x86-64", "linux-arm64": "aarch64"}[ident]
          import PySide6
          pyside = Path(PySide6.__file__).resolve().parent
          plugins = pyside / "Qt" / "plugins"
          if not plugins.is_dir():
              plugins = pyside / "plugins"
          if not plugins.is_dir():
              raise SystemExit("no Qt plugins folder in " + str(pyside))
          rel = plugins.relative_to(pyside).as_posix()
          sep = ";" if windows else ":"
          command = [sys.executable, "-m", "PyInstaller", "--onefile", "--noconfirm", "--noupx", "--name", "HYDRA-UMC_SUITE"]
          if windows:
              command += ["--windowed", "--icon", str(repo / "images" / "HYDRA_UMC_ICON.ico")]
          command += ["--add-data", f"{repo / 'assets'}{sep}assets", "--add-data", f"{repo / 'images'}{sep}images"]
          # the same plugin folders as build_exe.bat / build_exe.sh; a folder the wheel of this platform does not have (the Linux wheel has no "styles") is skipped, "platforms" is required
          for folder in ("platforms", "styles", "imageformats", "iconengines"):
              if not (plugins / folder).is_dir():
                  if folder == "platforms":
                      raise SystemExit("missing Qt plugin folder platforms")
                  print("note: this PySide6 has no plugin folder", folder)
                  continue
              command += ["--add-data", f"{plugins / folder}{sep}PySide6/{rel}/{folder}"]
          hidden = ["qasync", "websockets", "zeroconf", "zeroconf.asyncio", "zeroconf._utils.ipaddress", "ifaddr", "keyring", "keyring.backends", "keyring.backends.Windows",
                    "keyring.backends.macOS", "keyring.backends.SecretService", "keyring.backends.kwallet", "keyring.backends.fail", "keyring.backends.null",
                    "PySide6.QtOpenGL", "PySide6.QtQml", "PySide6.QtQuick"]
          if windows:
              hidden.append("OpenGL.platform.win32")
          for name in hidden:
              command += ["--hidden-import", name]


          def build(tag):
              dist, build_dir, spec = work / ("dist-" + tag), work / ("build-" + tag), work / ("spec-" + tag)
              for folder in (dist, build_dir, spec):
                  shutil.rmtree(folder, ignore_errors=True)
              subprocess.run(command + ["--distpath", str(dist), "--workpath", str(build_dir), "--specpath", str(spec), str(repo / "main.py")], check=True, cwd=repo)
              exe = dist / ("HYDRA-UMC_SUITE.exe" if windows else "HYDRA-UMC_SUITE")
              if not exe.is_file():
                  raise SystemExit("PyInstaller did not make " + str(exe))
              return exe


          def sha256_of(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for block in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(block)
              return digest.hexdigest()


          def check_platform(exe):
              head = exe.read_bytes()[:4096]
              if windows:
                  assert head[:2] == b"MZ", "not a Windows program"
                  offset = struct.unpack_from("<I", head, 0x3C)[0]
                  assert head[offset:offset + 4] == b"PE\0\0", "no PE header"
                  assert struct.unpack_from("<H", head, offset + 4)[0] == 0x8664, "not an x86-64 program"
              else:
                  assert head[:4] == b"\x7fELF", "not an ELF program"
                  machine = struct.unpack_from("<H", head, 18)[0]
                  assert machine == {"x86-64": 0x3E, "aarch64": 0xB7}[wanted_arch], f"wrong machine {machine:#x}"


          work.mkdir(parents=True, exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)
          first = build("1")
          check_platform(first)
          smoke = "not run (windowed program on a runner without a screen)"
          if not windows:
              log = work / "smoke.log"
              with open(log, "wb") as handle:
                  process = subprocess.Popen([str(first)], env=dict(os.environ, QT_QPA_PLATFORM="offscreen"), stdout=handle, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      smoke = f"exited with code {process.wait(timeout=25)} within 25 s"
                  except subprocess.TimeoutExpired:
                      smoke = "still running after 25 s (offscreen)"
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
              print("smoke:", smoke)
              print(log.read_bytes()[-1500:].decode("utf-8", "replace"))
          second = build("2")
          check_platform(second)
          sha1, sha2 = sha256_of(first), sha256_of(second)
          print("program build 1:", sha1)
          print("program build 2:", sha2)

          top = f"HYDRA-UMC_SUITE-{version}-{ident}"
          items = [(first, f"{top}/{first.name}", 0o755)]
          for name in ("README.md", "CHANGELOG.md", "LICENSE"):
              if (repo / name).is_file():
                  items.append((repo / name, f"{top}/{name}", 0o644))
          for folder in ("docs", "language"):
              for path in sorted((repo / folder).rglob("*")):
                  if path.is_file():
                      items.append((path, f"{top}/{path.relative_to(repo).as_posix()}", 0o644))
          assert any(arc.startswith(top + "/language/") for _, arc, _ in items), "the language folder is empty: the program needs it next to it"
          items.sort(key=lambda item: item[1])
          if windows:
              target = out / (top + ".zip")
              moment = time.gmtime(max(epoch, 315532800))[:6]
              with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                  for source, arcname, mode in items:
                      info = zipfile.ZipInfo(arcname, moment)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.create_system = 3
                      info.external_attr = (0o100000 | mode) << 16
                      archive.writestr(info, source.read_bytes(), compresslevel=9)
          else:
              target = out / (top + ".tar.gz")
              with open(target, "wb") as raw:
                  with gzip.GzipFile(filename="", mode="wb", fileobj=raw, compresslevel=9, mtime=0) as packed:
                      with tarfile.open(fileobj=packed, mode="w", format=tarfile.GNU_FORMAT) as archive:
                          for source, arcname, mode in items:
                              entry = tarfile.TarInfo(arcname)
                              entry.size, entry.mtime, entry.mode, entry.uid, entry.gid, entry.uname, entry.gname = source.stat().st_size, epoch, mode, 0, 0, "", ""
                              with open(source, "rb") as handle:
                                  archive.addfile(entry, handle)
          report = {
              "id": ident, "archive": target.name, "program": first.name, "program_sha256": sha1, "program_sha256_second_build": sha2, "program_bytes": first.stat().st_size,
              "program_identical_in_both_builds": sha1 == sha2, "pyinstaller": dist_version("pyinstaller"), "python": platform.python_version(), "pyside6": dist_version("PySide6"),
              "smoke_run": smoke,
          }
          (out / f"info-{ident}.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Build the program twice and pack it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          python "$RUNNER_TEMP/build_exe.py" "$ID" "$VERSION" "$GITHUB_WORKSPACE/out" "$RUNNER_TEMP/exe-work"
          ls -l out

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts-${{ matrix.id }}
          path: |
            out/*.zip
            out/*.tar.gz
            out/info-*.json
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Gather, attest and prepare the draft
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the three builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parts-*
          path: parts

      - name: Gather the archives, write SHA256SUMS and the build manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir files
          cp parts/*/*.zip parts/*/*.tar.gz files/
          test "$(ls files | wc -l)" -eq 3 || { echo "::error::expected 3 archives"; ls files; exit 1; }
          cd files
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import glob, json, os
          files = []
          for line in open("SHA256SUMS", encoding="utf-8"):
              digest, name = line.strip().split("  ", 1)
              files.append({"name": name, "sha256": digest, "bytes": os.path.getsize(name)})
          programs = [json.load(open(path, encoding="utf-8")) for path in sorted(glob.glob("../parts/*/info-*.json"))]
          assert len(programs) == 3, "a platform report is missing"
          identical = all(p["program_identical_in_both_builds"] for p in programs)
          json.dump({
              "schema": "hydra-build/1", "repository": os.environ["GITHUB_REPOSITORY"], "project": "suite-exe", "version": os.environ["VERSION"],
              "commit": os.environ["SHA"], "built_on": "github-actions", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "toolchain": "Python 3.12, requirements.txt as pinned, PyInstaller 6.22.3 --onefile --noupx (options of build_exe.bat / build_exe.sh); each program built twice on its runner",
              "package_format": "portable archive: program + language + docs (unsigned)", "reproducible": identical, "signed": False, "files": files, "programs": programs,
          }, open("build-manifest.json", "w", encoding="utf-8"), indent=2)
          PY
          cat SHA256SUMS
          {
            echo "### HYDRA-UMC-SUITE $VERSION (unsigned programs)"
            sed 's/^/- /' SHA256SUMS
            python3 -c "
          import json
          m = json.load(open('build-manifest.json', encoding='utf-8'))
          print('- the program is byte-identical in both builds on every platform:', m['reproducible'])
          for p in m['programs']:
              print('- ' + p['id'] + ': program ' + p['program_sha256'][:16] + ' / ' + p['program_sha256_second_build'][:16] + ', smoke: ' + p['smoke_run'])
          "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            files/*.zip
            files/*.tar.gz
            files/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-suite-${{ needs.plan.outputs.version }}
          path: files/*
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify the artifact as a stranger would
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNER: ${{ github.repository }}/.github/workflows/exe-build.yml
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe-suite-${{ needs.plan.outputs.version }}
          path: build

      - name: Check hashes, manifest, contents and attestation
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, struct, tarfile, zipfile
          manifest = json.load(open("build-manifest.json", encoding="utf-8"))
          assert manifest["signed"] is False and len(manifest["files"]) == 3, "unexpected manifest"
          for item in manifest["files"]:
              name = item["name"]
              if name.endswith(".zip"):
                  with zipfile.ZipFile(name) as archive:
                      names = archive.namelist()
                      program = [n for n in names if n.endswith("/HYDRA-UMC_SUITE.exe")]
                      assert len(program) == 1 and archive.read(program[0])[:2] == b"MZ", "no Windows program in " + name
              else:
                  with tarfile.open(name, "r:gz") as archive:
                      members = archive.getmembers()
                      assert all(m.isfile() for m in members), "something that is not a file in " + name
                      names = [m.name for m in members]
                      program = [n for n in names if n.endswith("/HYDRA-UMC_SUITE")]
                      assert len(program) == 1 and archive.extractfile(program[0]).read(4) == b"\x7fELF", "no Linux program in " + name
              assert all(not n.startswith(("/", "..")) and ".." not in n.split("/") for n in names), "a path leaves the archive " + name
              assert any("/language/" in n for n in names), "no language folder in " + name
              print("archive ok:", name, len(names), "entries")
          PY
          for file in *.zip *.tar.gz SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --source-digest "$GITHUB_SHA" >/dev/null
            echo "attestation ok: $file"
          done

  draft:
    name: Prepare the draft release (owner approval)
    needs: [plan, collect, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.actor }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Only the owner prepares a draft
        shell: bash
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository prepares a draft"; exit 1; }

      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe-suite-${{ needs.plan.outputs.version }}
          path: files

      - name: Prepare the draft release with the unsigned archives
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION-exe"
          if gh release list --json tagName --jq '.[].tagName' | grep -qx "$tag"; then
            echo "::error::the draft $tag already exists: delete it or raise the version before a new build"
            exit 1
          fi
          gh release create "$tag" files/* --draft --target "$SHA" --title "HYDRA-UMC-SUITE $VERSION (unsigned programs)" \
            --notes "Unsigned programs made by GitHub Actions. They are signed on the maintainer's machine and attached to the release v$VERSION; this draft is then deleted."
          echo "- draft release \`$tag\` prepared with the unsigned archives" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Tell the owner (issue build-failed)
    if: ${{ always() }}
    needs: [plan, build, collect, verify, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ needs.plan.result }} ${{ needs.build.result }} ${{ needs.collect.result }} ${{ needs.verify.result }}
      DRAFT: ${{ needs.draft.result }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label build-failed --state open --json number --jq '.[0].number // empty')"
          bad=""
          for r in $RESULTS; do [ "$r" = "success" ] || bad="$bad $r"; done
          # the draft job is skipped on purpose in a dry run; in any other case it must have passed
          if [ "$DRAFT" != "success" ] && ! { [ "$DRAFT" = "skipped" ] && [ "$DRY_RUN" = "true" ]; }; then bad="$bad draft:$DRAFT"; fi
          if [ -n "$bad" ]; then
            body="The build failed (plan / build / collect / verify: $RESULTS, draft: $DRAFT; anything but success counts as a failure: failure, timed out, cancelled or skipped). Run: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 --description "A build in GitHub Actions failed" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label build-failed --title "Build failed" --body "$body"
            fi
            echo "### The build failed: issue build-failed updated" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "A later build passed: $RUN_URL"
          fi

      - name: The notice itself failed
        if: ${{ failure() }}
        shell: bash
        run: |
