# Started by hand only (workflow_dispatch): it never runs on a push or on a pull request. It takes the screens of the README (tools/capture_screenshots.py: the real Qt Quick
# interface on the offscreen Qt platform with the software renderer, against a made-up server connection with made-up robots) and keeps the pictures as the artifact
# "screenshots" for two weeks. It has no secrets, publishes nothing and changes nothing in the repository: download the artifact, look at the pictures and copy the ones you
# want into images/screenshots.
#
#   gh workflow run screenshots.yml --repo JuanenRac/HYDRA-UMC-SUITE --ref main

name: Screenshots (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Take the screenshots of the README
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      # the offscreen platform finds no fonts by itself on Windows; on Linux it needs fontconfig and at least one font family
      - name: Install system libraries and fonts for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Install the dependencies
        run: pip install -r requirements.txt

      - name: Take the screenshots
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python tools/capture_screenshots.py --out "$RUNNER_TEMP/screenshots"

      - name: List the pictures
        run: |
          {
            echo "### Screenshots"
            echo
            echo "| file | bytes |"
            echo "| --- | --- |"
            for picture in "$RUNNER_TEMP"/screenshots/*.png; do
              echo "| $(basename "$picture") | $(stat -c %s "$picture") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
          if-no-files-found: error
