name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
      - name: Cache the 3D mesh package
        # The meshes are not in the repository tree: they come from one package with a pinned SHA-256
        # (meshes.pack.json). The package is kept between runs; a new revision changes the key.
        if: ${{ hashFiles('meshes.pack.json') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hydra-umc/meshes
          key: hydra-meshes-${{ hashFiles('meshes.pack.json') }}
      - name: Fetch and verify the 3D meshes
        # Before the verifiers and before any build that packs assets/. Every mesh is checked by its SHA-256.
        if: ${{ hashFiles('meshes.pack.json') != '' }}
        run: python -m hydra_suite.mesh_pack ensure --source download
      - name: Install system libraries for headless Qt (offscreen platform)
        # This baseline never ran the real tests/verify_*.py Qt/backend control
        # verifiers - only a bare Python-syntax compile - so a broken
        # button connection or a control that stopped reflecting real
        # state could reach main with a fully green CI. PySide6's
        # "offscreen" platform plugin (no real display needed) still
        # links against these at runtime.
        if: ${{ hashFiles('tools/run_offline_verifiers.py') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Python dependencies for the offline Qt/backend verifiers
        if: ${{ hashFiles('tools/run_offline_verifiers.py') != '' }}
        run: pip install -r requirements.txt pytest
      - name: Run offline Qt/backend control verifiers
        # Never sends a command to a real server/robot - each
        # tests/verify_*.py script's own header states the exact fake/
        # mocked boundary it verifies against. tests/test_net_manual.py
        # needs a real, already-running HYDRA-UMC-SERVER and is
        # deliberately excluded (see run_offline_verifiers.py's own
        # header) - never run automatically here.
        if: ${{ hashFiles('tools/run_offline_verifiers.py') != '' }}
        env:
          QT_QPA_PLATFORM: offscreen
        # pytest is the runner (one test per verifier, so the report names the one that failed); the verifiers
        # themselves stay scripts and `python tools/run_offline_verifiers.py` still runs them all without pytest.
        run: python -m pytest tests/test_offline_verifiers.py -q
      - name: Check the routes the app calls against the HYDRA-UMC-SDK contracts
        # The routes are compared with the recorded list, the server contract and the route table generated from it. The tag is the one
        # the SDK pin tool keeps in step.
        if: ${{ hashFiles('tests/test_rest_routes.py') != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/hydra-umc-sdk"
          curl -fsSL --retry 3 https://github.com/JuanenRac/HYDRA-UMC-SDK/archive/refs/tags/v0.5.9.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/hydra-umc-sdk"
          HYDRA_UMC_SDK_DIR="$RUNNER_TEMP/hydra-umc-sdk" python -m pytest tests/test_rest_routes.py -q
